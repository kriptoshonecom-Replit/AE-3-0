  <!-- Ribbon on body - vertical -->
  <rect x="13.5" y="14" width="5" height="15" fill="rgba(255,255,255,0.22)"/>
  <!-- Bow left loop -->
  <path d="M16 8.5 C15 4.5 8.5 3 9.5 6 C10.2 8 14.2 8.5 16 8.5Z" fill="#34d399"/>
  <!-- Bow right loop -->
